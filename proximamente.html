<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Proximamente en el portafolio de kavaxpi.">
    <title>Proximamente | kavaxpi</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <style>
        :root {
            --bg: #0c0e11;
            --panel: rgba(20, 24, 28, 0.9);
            --line: rgba(255, 255, 255, 0.13);
            --text: #f7f2e8;
            --muted: #aeb7bf;
            --accent: #f1ae47;
            --accent-2: #51d0a8;
        }

        * { box-sizing: border-box; }

        body {
            min-height: 100vh;
            display: grid;
            place-items: center;
            margin: 0;
            padding: 24px;
            overflow: hidden;
            color: var(--text);
            background:
                radial-gradient(circle at 18% 18%, rgba(81, 208, 168, 0.14), transparent 30%),
                radial-gradient(circle at 82% 80%, rgba(241, 174, 71, 0.12), transparent 32%),
                linear-gradient(145deg, #0c0e11, #151b1d);
            font-family: "Inter", sans-serif;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            z-index: -1;
            opacity: 0.35;
            background-image:
                linear-gradient(rgba(255, 255, 255, 0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.04) 1px, transparent 1px);
            background-size: 64px 64px;
        }

        .notice {
            width: min(100%, 620px);
            padding: clamp(28px, 6vw, 58px);
            border: 1px solid var(--line);
            border-radius: 8px;
            background: var(--panel);
            box-shadow: 0 24px 80px rgba(0, 0, 0, 0.4);
            text-align: center;
        }

        .icon {
            width: 64px;
            height: 64px;
            display: grid;
            place-items: center;
            margin: 0 auto 24px;
            border: 1px solid rgba(241, 174, 71, 0.34);
            border-radius: 8px;
            color: var(--accent);
            background: rgba(241, 174, 71, 0.1);
            font-size: 1.5rem;
        }

        .eyebrow {
            color: var(--accent-2);
            font-family: "JetBrains Mono", monospace;
            font-size: 0.8rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        h1 {
            margin: 14px 0;
            font-size: clamp(2.4rem, 8vw, 4.8rem);
            line-height: 0.98;
        }

        p {
            max-width: 470px;
            margin: 0 auto 28px;
            color: var(--muted);
            line-height: 1.7;
        }

        a {
            display: inline-flex;
            align-items: center;
            gap: 9px;
            min-height: 44px;
            padding: 0 18px;
            border: 1px solid rgba(241, 174, 71, 0.34);
            border-radius: 8px;
            color: #ffe0a8;
            background: rgba(241, 174, 71, 0.1);
            font-weight: 800;
            text-decoration: none;
        }

        a:hover { background: rgba(241, 174, 71, 0.18); }
    </style>
</head>
<body>
    <main class="notice">
        <div class="icon"><i class="fa-solid fa-hourglass-half"></i></div>
        <div class="eyebrow">A&uacute;n no subido</div>
        <h1>Pr&oacute;ximamente</h1>
        <p>Este plugin ya est&aacute; disponible, pero todav&iacute;a no ha sido subido a esta p&aacute;gina. Pr&oacute;ximamente podr&aacute;s encontrar aqu&iacute; toda la informaci&oacute;n.</p>
        <a href="index.html"><i class="fa-solid fa-arrow-left"></i> Volver al portafolio</a>
    </main>
</body>
</html>
